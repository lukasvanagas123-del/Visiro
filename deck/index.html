<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visiro Pitch Deck</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="deck.css">
</head>
<body>
  <div class="deck" id="deck"></div>
  <nav class="controls" aria-label="Slide controls">
    <button class="btn" id="prev" aria-label="Previous slide">←</button>
    <span id="counter"></span>
    <button class="btn" id="next" aria-label="Next slide">→</button>
    <a class="btn" href="../demo/">Open demo</a>
  </nav>
  <script src="../assets/config.js"></script>
  <script src="deck.js"></script>
</body>
</html>
