<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visiro Demo</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div class="placeholder-banner">Demo build · sample data · plans and prices are placeholders from <code>assets/config.js</code></div>

  <header class="topbar">
    <div class="brand"><span class="logo">◐</span> <span id="brand-name">Visiro</span></div>
    <div class="plan-switch" role="tablist" aria-label="Preview plan" id="plan-switch"></div>
    <div class="topbar-right">
      <a class="btn" href="../deck/">Pitch deck</a>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Features"></nav>
    <main class="main">
      <div class="plan-strip" id="plan-strip"></div>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="../assets/config.js"></script>
  <script src="demo.js"></script>
</body>
</html>
